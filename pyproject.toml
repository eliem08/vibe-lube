[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vibe-lube"
version = "0.1.0"
description = "Jiffy Lube for vibe-coded apps: quick fixes when your AI-built app breaks"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
vibe-lube = "vibe_lube.__main__:main"

[tool.setuptools]
packages = ["vibe_lube"]
