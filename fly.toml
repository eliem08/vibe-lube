# fly launch --copy-config --no-deploy && fly volumes create data --size 1 && fly deploy
app = "vibe-lube"
primary_region = "iad"

[build]

[env]
  PORT = "8000"
  DATA_DIR = "/data"

[mounts]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[http_service.checks]]
  path = "/healthz"
  interval = "30s"
  timeout = "5s"
